AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Room160: SMS-based AI learning assistant with teacher fallback.
  Uses Amazon Bedrock for generative AI and routes flagged messages to educators.

Parameters:
  TeacherEmail:
    Type: String
    Description: Email address of the teacher who will receive student messages

  EnableAI:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to 'false' to disable AI responses and always forward to teacher

  TextBeltAPIKey:
    Type: String
    NoEcho: true
    Description: Your TextBelt API key for sending SMS messages

Resources:
  # Secure storage for TextBelt API key
  TextBeltKeyParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/textbelt-api-key"
      Type: String
      Value: !Ref TextBeltAPIKey
      Description: "TextBelt API key for Room160 SMS functionality"
  # Student enrollment system
  StudentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-Students"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phoneNumber
          AttributeType: S
      KeySchema:
        - AttributeName: phoneNumber
          KeyType: HASH

  EnrollmentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-Enrollment"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt Room160LambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request
          import urllib.parse
          import os

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['STUDENT_TABLE'])

          def lambda_handler(event, context):
              try:
                  # Debug: log the event structure
                  print(f"Event: {json.dumps(event)}")
                  
                  # Handle GET request - serve HTML form (API Gateway format)
                  request_method = event.get('httpMethod', 'GET')
                  print(f"Request method: {request_method}")
                  
                  if request_method == 'GET':
                      html_form = '''
                      <!DOCTYPE html>
                      <html>
                      <head>
                          <title>Room160 - Enroll Students</title>
                          <style>
                              body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
                              h1 { color: #333; }
                              textarea { width: 100%; height: 200px; margin: 10px 0; padding: 10px; }
                              button { background: #007cba; color: white; padding: 15px 30px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
                              button:hover { background: #005a87; }
                              .instructions { background: #f0f8ff; padding: 15px; border-radius: 5px; margin: 20px 0; }
                          </style>
                      </head>
                      <body>
                          <h1>Room160 Student Enrollment</h1>
                          <div class="instructions">
                              <h3>Instructions:</h3>
                              <p>Enter student phone numbers below, one per line. You can use any format:</p>
                              <ul>
                                  <li>555-123-4567</li>
                                  <li>(555) 123-4567</li>
                                  <li>5551234567</li>
                                  <li>+1 555 123 4567</li>
                              </ul>
                          </div>
                          <form method="POST">
                              <label for="numbers"><strong>Student Phone Numbers:</strong></label><br>
                              <textarea name="numbers" id="numbers" placeholder="555-123-4567\n555-987-6543\n555-555-5555"></textarea><br>
                              <button type="submit">Enroll Students & Send Welcome Messages</button>
                          </form>
                      </body>
                      </html>'''
                      return {
                          'statusCode': 200,
                          'headers': {'Content-Type': 'text/html'},
                          'body': html_form,
                          'isBase64Encoded': False
                      }
                  
                  # Handle POST request - process enrollment
                  if event.get('body'):
                      # Check if it's form data or JSON
                      content_type = event.get('headers', {}).get('content-type', '')
                      if 'application/x-www-form-urlencoded' in content_type:
                          # Parse form data
                          import urllib.parse
                          form_data = urllib.parse.parse_qs(event['body'])
                          numbers_text = form_data.get('numbers', [''])[0]
                          students = [line.strip() for line in numbers_text.split('\n') if line.strip()]
                      else:
                          # Parse JSON data
                          body = json.loads(event['body'])
                          students = body.get('students', [])
                  else:
                      students = []
                  
                  enrolled = []
                  for phone in students:
                      # Clean phone number
                      clean_phone = ''.join(filter(str.isdigit, phone))
                      if len(clean_phone) == 10:
                          clean_phone = '+1' + clean_phone
                      elif len(clean_phone) == 11 and clean_phone.startswith('1'):
                          clean_phone = '+' + clean_phone
                      
                      # Store in DynamoDB
                      table.put_item(Item={'phoneNumber': clean_phone})
                      
                      # Send welcome message via TextBelt (avoid including email to prevent URL detection)
                      welcome_msg = "Welcome to Room160 homework help! Text your questions here for instant AI assistance. Start messages with @teacher to reach your teacher directly- be sure to include your name and a way for them to get in touch with you."
                      # Get API key from Parameter Store
                      ssm = boto3.client('ssm')
                      api_key = ssm.get_parameter(
                          Name=os.environ['TEXTBELT_KEY_PARAM'],
                          WithDecryption=True
                      )['Parameter']['Value']
                      
                      # Send SMS via TextBelt using urllib
                      data = urllib.parse.urlencode({
                          'phone': clean_phone,
                          'message': welcome_msg,
                          'replyWebhookUrl': os.environ['WEBHOOK_URL'],
                          'key': api_key
                      }).encode('utf-8')
                      
                      req = urllib.request.Request('https://textbelt.com/text', data=data, method='POST')
                      req.add_header('Content-Type', 'application/x-www-form-urlencoded')
                      response = urllib.request.urlopen(req)
                      response_data = response.read().decode('utf-8')
                      
                      enrolled.append({'phone': clean_phone, 'status': 'enrolled'})
                  
                  # Return HTML response for form submission
                  if event.get('headers', {}).get('content-type', '').startswith('application/x-www-form-urlencoded'):
                      success_html = f'''
                      <!DOCTYPE html>
                      <html>
                      <head>
                          <title>Room160 - Enrollment Complete</title>
                          <style>
                              body {{ font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }}
                              .success {{ background: #d4edda; color: #155724; padding: 15px; border-radius: 5px; margin: 20px 0; }}
                              .student {{ background: #f8f9fa; padding: 10px; margin: 5px 0; border-radius: 3px; }}
                              a {{ color: #007cba; text-decoration: none; }}
                              a:hover {{ text-decoration: underline; }}
                          </style>
                      </head>
                      <body>
                          <h1>Enrollment Complete!</h1>
                          <div class="success">
                              <strong>Successfully enrolled {len(enrolled)} students:</strong>
                          </div>
                          {''.join([f'<div class="student">{student["phone"]}</div>' for student in enrolled])}
                          <p>All students have been sent welcome messages and can now text homework questions!</p>
                          <p><a href="/prod/enroll">Enroll More Students</a></p>
                      </body>
                      </html>'''
                      return {
                          'statusCode': 200,
                          'headers': {'Content-Type': 'text/html'},
                          'body': success_html,
                          'isBase64Encoded': False
                      }
                  else:
                      # Return JSON for API calls
                      return {
                          'statusCode': 200,
                          'body': json.dumps({'enrolled': enrolled})
                      }
              except Exception as e:
                  print(f"Error in enrollment function: {str(e)}")
                  import traceback
                  print(f"Traceback: {traceback.format_exc()}")
                  
                  error_html = f'''
                  <!DOCTYPE html>
                  <html>
                  <head>
                      <title>Room160 - Error</title>
                      <style>
                          body {{ font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }}
                          .error {{ background: #f8d7da; color: #721c24; padding: 15px; border-radius: 5px; margin: 20px 0; }}
                          a {{ color: #007cba; text-decoration: none; }}
                      </style>
                  </head>
                  <body>
                      <h1>Enrollment Error</h1>
                      <div class="error">
                          <strong>Error:</strong> {str(e)}
                      </div>
                      <p><a href="#" onclick="window.location.reload()">← Try Again</a></p>
                  </body>
                  </html>'''
                  return {
                      'statusCode': 500,
                      'headers': {'Content-Type': 'text/html'},
                      'body': error_html,
                      'isBase64Encoded': False
                  }
      Environment:
        Variables:
          STUDENT_TABLE: !Ref StudentTable
          TEXTBELT_KEY_PARAM: !Ref TextBeltKeyParameter
          WEBHOOK_URL: !Sub "https://${SMSWebhookAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook"
          TEACHER_EMAIL: !Ref TeacherEmail

  # API Gateway for enrollment form
  EnrollmentAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: "Room160-Enrollment-API"
      Description: "API for student enrollment form"

  EnrollmentResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref EnrollmentAPI
      ParentId: !GetAtt EnrollmentAPI.RootResourceId
      PathPart: "enroll"

  EnrollmentMethodGET:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref EnrollmentAPI
      ResourceId: !Ref EnrollmentResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EnrollmentFunction.Arn}/invocations"

  EnrollmentMethodPOST:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref EnrollmentAPI
      ResourceId: !Ref EnrollmentResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EnrollmentFunction.Arn}/invocations"

  EnrollmentDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: 
      - EnrollmentMethodGET
      - EnrollmentMethodPOST
    Properties:
      RestApiId: !Ref EnrollmentAPI
      StageName: "prod"

  EnrollmentLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EnrollmentFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EnrollmentAPI}/*/*"

  # Lambda URL for direct SMS webhook (simpler than API Gateway)
  SMSWebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "Room160-SMS-Webhook"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt Room160LambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.parse
          import os

          sns = boto3.client('sns')

          def lambda_handler(event, context):
              try:
                  # Debug: log the entire event
                  print(f"Webhook event received: {json.dumps(event)}")
                  
                  # Handle direct invocation for testing
                  if 'body' not in event:
                      message = event.get('message', 'Test message')
                      sender = event.get('sender', '+1234567890')
                      print(f"Direct invocation - Message: {message}, Sender: {sender}")
                  else:
                      # Parse TextBelt webhook format (JSON payload)
                      body = json.loads(event['body']) if event['body'] else {}
                      print(f"TextBelt webhook body: {body}")
                      
                      message = body.get('text', '')
                      sender = body.get('fromNumber', 'Unknown')
                      text_id = body.get('textId', 'Unknown')
                      
                      print(f"Parsed - Message: {message}, Sender: {sender}, TextID: {text_id}")

                  # Publish to SNS topic for processing
                  sns.publish(
                      TopicArn=os.environ['SNS_TOPIC_ARN'],
                      Message=message,
                      MessageAttributes={
                          'SenderID': {'DataType': 'String', 'StringValue': sender}
                      }
                  )

                  print(f"Successfully published to SNS topic: {os.environ['SNS_TOPIC_ARN']}")
                  return {
                      'statusCode': 200,
                      'body': json.dumps({'message': 'SMS received and processed'})
                  }
              except Exception as e:
                  print(f"Error processing SMS: {e}")
                  return {'statusCode': 500, 'body': f'Error: {str(e)}'}
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref Room160SNSTopic
          ENABLE_AI: !Ref EnableAI

  # API Gateway for SMS webhook
  SMSWebhookAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: "Room160-SMS-Webhook-API"
      Description: "API for TextBelt SMS webhook"

  SMSWebhookResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SMSWebhookAPI
      ParentId: !GetAtt SMSWebhookAPI.RootResourceId
      PathPart: "webhook"

  SMSWebhookMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SMSWebhookAPI
      ResourceId: !Ref SMSWebhookResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SMSWebhookFunction.Arn}/invocations"

  SMSWebhookDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: SMSWebhookMethod
    Properties:
      RestApiId: !Ref SMSWebhookAPI
      StageName: "prod"

  SMSWebhookLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SMSWebhookFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SMSWebhookAPI}/*/*"

  Room160SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: "Room160 Student Messages"
      TopicName: "Room160StudentMessages"

  TeacherEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref TeacherEmail
      TopicArn: !Ref Room160SNSTopic

  Room160LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "Room160LambdaPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource: !GetAtt StudentTable.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/textbelt-api-key"

  Room160RouterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "Room160Router"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt Room160LambdaRole.Arn
      Timeout: 120
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          bedrock_runtime = boto3.client("bedrock-runtime")
          sns = boto3.client("sns")

          def lambda_handler(event, context):
              print(f"Router Lambda invoked with event: {json.dumps(event)}")
              
              record = event['Records'][0]['Sns']
              message = record['Message']
              sender = record.get('MessageAttributes', {}).get('SenderID', {}).get('Value', 'Unknown')
              ai_enabled = os.environ.get("ENABLE_AI", "true") == "true"
              
              print(f"Processing message from {sender}: {message}")
              print(f"AI enabled: {ai_enabled}")

              if message.lower().startswith("@teacher") or not ai_enabled:
                  sns.publish(
                      TopicArn=os.environ['TEACHER_TOPIC_ARN'],
                      Subject=f"Room160: Student Message from {sender}",
                      Message=f"Student: {sender}\n\nMessage: {message}\n\n---\nTo respond, text the student directly at {sender}"
                  )
                  return {"statusCode": 200, "body": "Forwarded to teacher."}

              try:
                  print(f"Processing AI request for message: {message}")
                  
                  prompt = f"\n\nHuman: You are an educational assistant for school students. " \
                           f"Your responses will be sent via SMS to mobile phones, so keep answers concise but helpful. " \
                           f"Use simple language and short sentences. Always be safe and educational. " \
                           f"NEVER include URLs, links, or web addresses in your responses. " \
                           f"Do not respond to inappropriate messages.\n\n" \
                           f"Human: {message}\n\nAssistant:"

                  print(f"Calling Bedrock with prompt length: {len(prompt)}")
                  
                  response = bedrock_runtime.invoke_model(
                      modelId="anthropic.claude-3-5-sonnet-20240620-v1:0",
                      body=json.dumps({
                          "anthropic_version": "bedrock-2023-05-31",
                          "max_tokens": 300,
                          "messages": [
                              {
                                  "role": "user",
                                  "content": f"You are an educational assistant for school students. Your responses will be sent via SMS to mobile phones, so keep answers concise but helpful. Use simple language and short sentences. Always be safe and educational. NEVER include URLs, links, or web addresses in your responses. Do not respond to inappropriate messages.\n\n{message}"
                              }
                          ]
                      }),
                      contentType="application/json",
                      accept="application/json"
                  )

                  print(f"Bedrock response received")
                  result = json.loads(response['body'].read())
                  ai_reply = result.get("content", [{}])[0].get("text", "Sorry, I couldn't answer that. Please ask your teacher.")
                  print(f"AI reply: {ai_reply[:100]}...")

                  # Send SMS response via TextBelt
                  import urllib.request
                  import urllib.parse
                  print(f"Getting TextBelt API key from Parameter Store")
                  
                  ssm = boto3.client('ssm')
                  api_key = ssm.get_parameter(
                      Name=os.environ['TEXTBELT_KEY_PARAM'],
                      WithDecryption=True
                  )['Parameter']['Value']
                  
                  print(f"Sending SMS to {sender}")
                  data = urllib.parse.urlencode({
                      'phone': sender,
                      'message': ai_reply.strip(),
                      'key': api_key
                  }).encode('utf-8')
                  
                  req = urllib.request.Request('https://textbelt.com/text', data=data, method='POST')
                  req.add_header('Content-Type', 'application/x-www-form-urlencoded')
                  textbelt_response = urllib.request.urlopen(req)
                  textbelt_result = textbelt_response.read().decode('utf-8')
                  print(f"TextBelt response: {textbelt_result}")

              except Exception as e:
                  print(f"AI Error: {e}")
                  import traceback
                  print(f"Full traceback: {traceback.format_exc()}")
                  print(f"Error type: {type(e).__name__}")
                  print(f"Error args: {e.args}")
                  sns.publish(
                      TopicArn=os.environ['TEACHER_TOPIC_ARN'],
                      Subject=f"Room160: AI Error - Student {sender}",
                      Message=f"Student: {sender}\n\nMessage: {message}\n\nError: AI failed to respond\n\n---\nTo respond, text the student directly at {sender}"
                  )
                  # Send error SMS via TextBelt
                  try:
                      import urllib.request
                      import urllib.parse
                      print(f"Sending error SMS to {sender}")
                      
                      ssm = boto3.client('ssm')
                      api_key = ssm.get_parameter(
                          Name=os.environ['TEXTBELT_KEY_PARAM'],
                          WithDecryption=True
                      )['Parameter']['Value']
                      
                      data = urllib.parse.urlencode({
                          'phone': sender,
                          'message': "I'm not sure how to answer that. Please ask your teacher.",
                          'key': api_key
                      }).encode('utf-8')
                      
                      req = urllib.request.Request('https://textbelt.com/text', data=data, method='POST')
                      req.add_header('Content-Type', 'application/x-www-form-urlencoded')
                      error_response = urllib.request.urlopen(req)
                      error_result = error_response.read().decode('utf-8')
                      print(f"Error SMS TextBelt response: {error_result}")
                  except Exception as sms_error:
                      print(f"Failed to send error SMS: {sms_error}")

              # Always return 200 to prevent SNS from retrying failed messages
              # This ensures students don't get duplicate responses or error loops
              return {"statusCode": 200, "body": "Message processed - no retry needed"}
      Environment:
        Variables:
          TEACHER_TOPIC_ARN: !Ref Room160SNSTopic
          ENABLE_AI: !Ref EnableAI
          TEXTBELT_KEY_PARAM: !Ref TextBeltKeyParameter

  Room160LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Room160RouterFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref Room160SNSTopic

  # SNS subscription to trigger Router Lambda
  RouterLambdaSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      Endpoint: !GetAtt Room160RouterFunction.Arn
      TopicArn: !Ref Room160SNSTopic

Outputs:
  EnrollmentURL:
    Description: "URL to enroll students via web form"
    Value: !Sub "https://${EnrollmentAPI}.execute-api.${AWS::Region}.amazonaws.com/prod/enroll"
