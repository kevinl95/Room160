AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Room160: SMS-based AI learning assistant with teacher fallback.
  Uses Amazon Bedrock for generative AI and routes flagged messages to educators.

Parameters:
  TeacherEmail:
    Type: String
    Description: Email address of the teacher who will receive student messages

  EnableAI:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to 'false' to disable AI responses and always forward to teacher

Resources:
  # Pinpoint SMS Integration
  PinpointProject:
    Type: AWS::Pinpoint::App
    Properties:
      Name: !Sub "${AWS::StackName}-SMS"

  PinpointSMSChannel:
    Type: AWS::Pinpoint::SMSChannel
    Properties:
      ApplicationId: !Ref PinpointProject
      Enabled: true

  # Lambda URL for direct SMS webhook (simpler than API Gateway)
  SMSWebhookFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "Room160-SMS-Webhook"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt Room160LambdaRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.parse
          import os

          sns = boto3.client('sns')

          def lambda_handler(event, context):
              try:
                  # Handle direct invocation for testing
                  if 'body' not in event:
                      message = event.get('message', 'Test message')
                      sender = event.get('sender', '+1234567890')
                  else:
                      # Parse webhook from SMS provider
                      if event.get('headers', {}).get('content-type', '').startswith('application/x-www-form-urlencoded'):
                          body = urllib.parse.parse_qs(event['body'])
                          message = body.get('Body', [''])[0]
                          sender = body.get('From', ['Unknown'])[0]
                      else:
                          body = json.loads(event['body']) if event['body'] else {}
                          message = body.get('Body', body.get('message', ''))
                          sender = body.get('From', body.get('from', 'Unknown'))

                  # Publish to SNS topic for processing
                  sns.publish(
                      TopicArn=os.environ['SNS_TOPIC_ARN'],
                      Message=message,
                      MessageAttributes={
                          'SenderID': {'DataType': 'String', 'StringValue': sender}
                      }
                  )

                  return {
                      'statusCode': 200,
                      'body': json.dumps({'message': 'SMS received and processed'})
                  }
              except Exception as e:
                  print(f"Error processing SMS: {e}")
                  return {'statusCode': 500, 'body': f'Error: {str(e)}'}
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref Room160SNSTopic

  SMSWebhookURL:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref SMSWebhookFunction
      AuthType: NONE
      Cors:
        AllowMethods: ["POST"]
        AllowOrigins: ["*"]

  Room160SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: "Room160 Student Messages"
      TopicName: "Room160StudentMessages"

  TeacherEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref TeacherEmail
      TopicArn: !Ref Room160SNSTopic

  Room160LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "Room160LambdaExecutionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "Room160LambdaPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
              - Effect: Allow
                Action:
                  - mobiletargeting:SendMessages
                Resource: "*"

  Room160RouterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: "Room160Router"
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt Room160LambdaRole.Arn
      Timeout: 15
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          bedrock_runtime = boto3.client("bedrock-runtime")
          sns = boto3.client("sns")

          def lambda_handler(event, context):
              record = event['Records'][0]['Sns']
              message = record['Message']
              sender = record.get('MessageAttributes', {}).get('SenderID', {}).get('Value', 'Unknown')
              ai_enabled = os.environ.get("ENABLE_AI", "true") == "true"

              if message.lower().startswith("@teacher") or "help" in message.lower() or not ai_enabled:
                  sns.publish(
                      TopicArn=os.environ['TEACHER_TOPIC_ARN'],
                      Message=f"Student message from {sender}:\n\n{message}"
                  )
                  return {"statusCode": 200, "body": "Forwarded to teacher."}

              try:
                  prompt = f"\n\nHuman: You are an educational assistant for school students. " \
                           f"Always be safe and educational. Do not respond to inappropriate messages.\n\n" \
                           f"Human: {message}\n\nAssistant:"

                  response = bedrock_runtime.invoke_model(
                      modelId="anthropic.claude-3-sonnet-20240229-v1:0",
                      body=json.dumps({
                          "prompt": prompt,
                          "max_tokens_to_sample": 300,
                          "temperature": 0.5,
                          "top_k": 250,
                          "top_p": 0.9,
                          "stop_sequences": ["\n\nHuman:"]
                      }),
                      contentType="application/json",
                      accept="application/json"
                  )

                  result = json.loads(response['body'].read())
                  ai_reply = result.get("completion", "Sorry, I couldn't answer that. Please ask your teacher.")

                  # Send SMS response via Pinpoint
                  pinpoint = boto3.client('pinpoint')
                  pinpoint.send_messages(
                      ApplicationId=os.environ['PINPOINT_APP_ID'],
                      MessageRequest={
                          'Addresses': {
                              sender: {'ChannelType': 'SMS'}
                          },
                          'MessageConfiguration': {
                              'SMSMessage': {
                                  'Body': ai_reply.strip()[:160],  # SMS length limit
                                  'MessageType': 'TRANSACTIONAL'
                              }
                          }
                      }
                  )

              except Exception as e:
                  print(f"AI Error: {e}")
                  sns.publish(
                      TopicArn=os.environ['TEACHER_TOPIC_ARN'],
                      Message=f"AI failed to respond to message from {sender}:\n\n{message}"
                  )
                  # Send error SMS via Pinpoint
                  pinpoint = boto3.client('pinpoint')
                  pinpoint.send_messages(
                      ApplicationId=os.environ['PINPOINT_APP_ID'],
                      MessageRequest={
                          'Addresses': {
                              sender: {'ChannelType': 'SMS'}
                          },
                          'MessageConfiguration': {
                              'SMSMessage': {
                                  'Body': "I'm not sure how to answer that. Please ask your teacher.",
                                  'MessageType': 'TRANSACTIONAL'
                              }
                          }
                      }
                  )

              return {"statusCode": 200, "body": "Response sent."}
      Environment:
        Variables:
          TEACHER_TOPIC_ARN: !Ref Room160SNSTopic
          ENABLE_AI: !Ref EnableAI
          PINPOINT_APP_ID: !Ref PinpointProject

  Room160LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Room160RouterFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref Room160SNSTopic

Outputs:
  SMSWebhookURL:
    Description: "Webhook URL for SMS integration"
    Value: !GetAtt SMSWebhookURL.FunctionUrl

  PinpointApplicationId:
    Description: "Pinpoint Application ID for SMS sending"
    Value: !Ref PinpointProject

  SetupInstructions:
    Description: "Complete setup guide"
    Value: "STEP 1: Get SMS number from Twilio ($1/month) or similar. STEP 2: Configure webhook to SMSWebhookURL. STEP 3: Students can now text your number!"

